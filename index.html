<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボットに命令しよう！｜情報Ⅰ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#e5f3ff,#f5efff);font-family:Meiryo,'Yu Gothic',sans-serif;color:#213b58}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid orange;outline-offset:2px}.wrap{max-width:1150px;margin:auto;padding:20px 15px}h1{margin:0;font-size:clamp(24px,3vw,36px)}.sub{color:#58728b;font-size:14px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.nav button{padding:12px 18px;border:2px solid #cadfee;border-radius:12px;background:white;font-weight:bold;color:#315b83}.nav button.current{background:#dceeff;border-color:#3280ca}.nav button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.panel{background:white;padding:20px;border-radius:20px;border:1px solid #d7e5f1;box-shadow:0 8px 25px #1d4a7911}h2{margin:8px 0;font-size:22px}.eyebrow{color:#3782c5;font-weight:bold;font-size:12px}.mission{line-height:1.7;color:#526d86}.scene{position:relative;height:330px;border:2px solid #c6dff0;border-radius:16px;overflow:hidden;background:linear-gradient(#d9efff 0 72%,#e8d5b9 72%)}.window{position:absolute;left:6%;top:12%;width:29%;height:30%;background:#b7e5ff;border:7px solid #a1c7e2;border-radius:5px}.board{position:absolute;right:8%;top:12%;width:28%;height:23%;background:#84b7a6;border:7px solid #d3b482}.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:92%;min-width:170px;padding:9px;background:white;border:2px solid #9fc7ea;border-radius:12px;text-align:center;font-weight:bold;z-index:9;font-size:14px}.obj{position:absolute;bottom:12%;font-size:42px;transition:opacity .25s;z-index:2}.obj.paper{left:46%}.obj.bin{right:6%;font-size:64px}.obj.broom{left:7%;font-size:58px}.obj.dust{left:55%}.obj.desk{right:9%;font-size:62px}.obj.smudge{right:15%;bottom:32%;font-size:24px}.obj.rag{left:31%}.robot{position:absolute;left:8%;bottom:10%;width:120px;height:170px;z-index:5;transition:left 1s ease,transform .3s ease}.robot.walk .foot{animation:walk .3s alternate infinite}.robot.work{transform:translateY(14px) rotate(5deg)}.robot.happy .hand{animation:wave .3s alternate infinite}.robot .hand,.robot .foot{transform-box:fill-box;transform-origin:top center}.held{position:absolute;z-index:7;font-size:29px;bottom:24%;left:calc(var(--robot-x,8%) + 82px);transition:left 1s ease}.status{margin-top:12px;padding:12px;background:#eff7ff;border-radius:11px;font-weight:bold;min-height:44px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 18px}.card{border:2px solid #b8d7f2;background:#f0f7ff;color:#255b8e;border-radius:11px;padding:12px 8px;min-height:51px;font-weight:bold;font-size:14px}.card:hover:not(:disabled){background:#deefff}.card:disabled{opacity:.38}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.step{border:2px dashed #c5d7e7;border-radius:10px;min-height:51px;display:flex;align-items:center;padding:8px;gap:7px;font-size:13px}.step.filled{background:#f1f7ff;border-style:solid}.step.active{border-color:#e6a029;background:#fff2d8}.num{border-radius:50%;background:#d9eafb;padding:4px 8px;font-weight:bold}.step .txt{flex:1}.remove{border:0;background:transparent;color:#b34e61;font-size:22px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.primary{grid-column:span 2;border:0;background:#2c79c6;color:white;padding:15px;border-radius:12px;font-weight:bold;font-size:17px}.secondary{border:1px solid #c3d7e8;background:white;border-radius:10px;padding:11px;color:#35638a;font-weight:bold}.actions button:disabled{opacity:.45;cursor:not-allowed}.feedback{padding:13px;border:1px solid #c6ddf1;border-radius:11px;background:#f1f7ff;line-height:1.65;margin-top:12px;min-height:75px}.feedback.ok{background:#e9f8ee;border-color:#9dd5b1}.feedback.bad{background:#fff1e5;border-color:#eec7a4}.next{width:100%;margin-top:10px;border:0;background:#16845a;color:white;padding:12px;border-radius:11px;font-weight:bold}.next[hidden]{display:none}.footer{margin-top:16px;background:white;padding:15px;border-radius:14px;line-height:1.7;color:#526c83}.options{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.options select{padding:5px}.small{font-size:12px;color:#6c8295}@keyframes walk{to{transform:rotate(22deg)}}@keyframes wave{to{transform:rotate(30deg)}}@media(max-width:800px){.layout{grid-template-columns:1fr}.scene{height:300px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><h1>🤖 ロボットに命令しよう！</h1><p class="sub">教科書 p74-75「アルゴリズムとプログラム」｜命令を考えて、ロボットを動かそう！</p><nav class="nav" id="nav" aria-label="ステージ選択"></nav><div class="layout"><section class="panel"><div class="eyebrow" id="stageLabel"></div><h2 id="stageTitle"></h2><p class="mission" id="mission"></p><div class="scene" id="scene"><div class="window"></div><div class="board"></div><div class="bubble" id="bubble" aria-live="polite">命令を待っているよ！</div><div class="obj paper" id="paper">🗞️</div><div class="obj bin" id="bin">🗑️</div><div class="obj broom" id="broom">🧹</div><div class="obj dust" id="dust">🍂</div><div class="obj desk" id="desk">🪑</div><div class="obj smudge" id="smudge">💧</div><div class="obj rag" id="rag">🧽</div><svg class="robot" id="robot" viewBox="0 0 130 185" role="img" aria-label="青い人型ロボット"><g class="foot"><rect x="36" y="137" width="20" height="34" rx="8" fill="#588ec8"/><ellipse cx="45" cy="170" rx="18" ry="8" fill="#386ca4"/></g><g class="foot"><rect x="74" y="137" width="20" height="34" rx="8" fill="#588ec8"/><ellipse cx="83" cy="170" rx="18" ry="8" fill="#386ca4"/></g><rect x="30" y="88" width="70" height="60" rx="18" fill="#7cb9ef" stroke="#356d9e" stroke-width="4"/><rect x="48" y="107" width="34" height="24" rx="9" fill="white"/><circle cx="65" cy="119" r="8" fill="#46cdbd"/><g class="hand"><rect x="13" y="98" width="22" height="48" rx="10" fill="#7cb9ef" stroke="#356d9e" stroke-width="3"/></g><g class="hand"><rect x="96" y="98" width="22" height="48" rx="10" fill="#7cb9ef" stroke="#356d9e" stroke-width="3"/></g><rect x="20" y="24" width="90" height="73" rx="28" fill="#7cb9ef" stroke="#356d9e" stroke-width="4"/><rect x="30" y="38" width="70" height="46" rx="18" fill="#f8fcff"/><ellipse cx="50" cy="58" rx="6" ry="8" fill="#244b7b"/><ellipse cx="80" cy="58" rx="6" ry="8" fill="#244b7b"/><path d="M54 71 Q65 80 76 71" stroke="#244b7b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M65 24V13" stroke="#356d9e" stroke-width="4"/><circle cx="65" cy="10" r="8" fill="#ffce70" stroke="#cc9336" stroke-width="2"/><text id="held" x="106" y="145" font-size="27" style="display:none">🗞️</text></svg><div class="held" id="held" hidden></div></div><div class="status" id="status" aria-live="polite"></div><p class="small">ロボットは命令を上から順番に実行します。途中で止まったら、命令を見直そう。</p><div class="options"><label>速さ <select id="speed"><option value="1">ふつう</option><option value="1.7">ゆっくり</option><option value="0.6">はやい</option></select></label><label><input type="checkbox" id="sound" checked> 効果音</label></div></section><section class="panel"><div class="eyebrow">COMMAND CARDS</div><h2>① 命令カードを選ぼう</h2><p class="mission">カードをクリックすると、選んだ順番に下へ並びます。</p><div class="cards" id="cards"></div><h2>② ロボットに出す命令</h2><p class="small" id="count"></p><div class="steps" id="steps"></div><div class="actions"><button class="primary" id="run">▶ ロボットを動かす！</button><button class="secondary" id="undo">↶ 1つ戻す</button><button class="secondary" id="reset">⟲ 命令を消す</button><button class="secondary" id="hint">💡 ヒント</button><button class="secondary" id="replay">▶ もう一度見る</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" hidden>次のステージへ →</button></section></div><div class="footer"><b>今日の学習：</b>アルゴリズムとは、作業や処理を行うための<b>手順</b>。命令を並べて試し、失敗したら直してみよう。<br>名前・メールアドレスの入力は不要です。ゲームは外部の画像・音声・ライブラリを使わずに動きます。</div></main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const commands={
 pick:['ゴミを拾う','🖐️'],carry:['ゴミ箱へ運ぶ','🚶'],drop:['ゴミ箱に入れる','🗑️'],
 takeBroom:['ほうきを持つ','🧹'],sweep:['床を掃く','✨'],collect:['ゴミを集める','🍂'],discard:['ゴミを捨てる','🗑️'],returnBroom:['ほうきを片付ける','📦'],
 takeRag:['雑巾を持つ','🧽'],wipe:['机を拭く','🪑'],returnRag:['雑巾を片付ける','📦'],
 openWindow:['窓を開ける','🪟'],lightOff:['電気を消す','💡'],sit:['いすに座る','🪑']};
const stages=[
 {title:'ゴミをゴミ箱に入れよう！',mission:'床のゴミを拾って、ゴミ箱に入れよう。3枚の命令を正しい順番に並べてね。',required:['pick','carry','drop'],cards:['drop','pick','carry'],objects:['paper','bin'],hint:'ゴミを持っていないと、ゴミ箱まで運べないよ。'},
 {title:'教室の床を掃除しよう！',mission:'7枚のカードから必要な5枚を選び、床を掃いてゴミを捨て、ほうきを片付けよう。関係のないカードも混ざっているよ。',required:['takeBroom','sweep','collect','discard','returnBroom'],cards:['lightOff','collect','returnBroom','sweep','openWindow','discard','takeBroom'],objects:['broom','dust','bin'],hint:'ほうきを持つ → 床を掃く → ゴミを集める、の順番を考えてみよう。'},
 {title:'教室をピカピカにしよう！',mission:'11枚から必要な8枚を選んで、床のゴミを捨て、机を拭き、床を掃こう。使った道具も元の場所に戻そう。正しい順番は1通りとは限らないよ。',required:['pick','drop','takeRag','wipe','returnRag','takeBroom','sweep','returnBroom'],cards:['returnRag','lightOff','sweep','pick','sit','takeBroom','wipe','openWindow','drop','returnBroom','takeRag'],objects:['paper','bin','rag','desk','smudge','broom'],hint:'ゴミを捨てる前には拾う。机を拭く前には雑巾を持つ。床を掃く前にはほうきを持つ。'}
];
let stage=0,unlocked=0,selected=[],busy=false,played=false,cleared=false,lastResult=null,audioCtx=null;
function feedback(msg,kind=''){$('feedback').textContent=msg;$('feedback').className='feedback '+kind}
function say(msg){$('bubble').textContent=msg}
function time(ms){let factor=Number($('speed').value)||1;return new Promise(resolve=>setTimeout(resolve,window.matchMedia('(prefers-reduced-motion: reduce)').matches?20:Math.round(ms*factor)))}
function beep(freq=550){if(!$('sound').checked)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);o.stop(audioCtx.currentTime+.13)}catch(e){}}
function setRobotX(x){$('robot').style.left=x+'%';$('scene').style.setProperty('--robot-x',x+'%')}
function resetScene(){setRobotX(8);$('robot').setAttribute('class','robot');$('held').hidden=true;$('held').textContent='';for(const id of ['paper','bin','broom','dust','desk','smudge','rag']){$(id).style.display=stages[stage].objects.includes(id)?'block':'none';$(id).style.opacity='1'}say('命令を待っているよ！');$('status').textContent='待機中：命令を選んでね。'}
function renderNav(){const nav=$('nav');nav.replaceChildren();stages.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`ステージ${i+1} ${i>unlocked?'🔒':i<unlocked?'✓':''}`;b.disabled=busy||i>unlocked;b.className=i===stage?'current':'';if(i===stage)b.setAttribute('aria-current','step');b.addEventListener('click',()=>loadStage(i));nav.append(b)})}
function render(){renderNav();const cards=$('cards'),steps=$('steps'),s=stages[stage];cards.replaceChildren();steps.replaceChildren();s.cards.forEach(id=>{const b=document.createElement('button');b.className='card';b.textContent=commands[id][1]+' '+commands[id][0];b.disabled=busy||selected.includes(id)||selected.length>=s.required.length;b.addEventListener('click',()=>{selected.push(id);played=false;cleared=false;resetScene();feedback('命令を選びました。必要な枚数がそろったら実行してみよう！');render()});cards.append(b)});for(let i=0;i<s.required.length;i++){const slot=document.createElement('div');slot.className='step'+(selected[i]?' filled':'');slot.id='slot'+i;const n=document.createElement('span');n.className='num';n.textContent=i+1;const label=document.createElement('span');label.className='txt';label.textContent=selected[i]?commands[selected[i]][0]:'命令を選ぶ';slot.append(n,label);if(selected[i]&&!busy){const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label',`${i+1}番目の命令を削除`);del.addEventListener('click',()=>{selected.splice(i,1);played=false;cleared=false;resetScene();render()});slot.append(del)}steps.append(slot)}$('count').textContent=`${selected.length} / ${s.required.length} 枚選択中`;$('run').disabled=busy||selected.length!==s.required.length;$('undo').disabled=busy||selected.length===0;$('reset').disabled=busy||selected.length===0;$('hint').disabled=busy;$('replay').disabled=busy||!played;$('next').hidden=!(cleared&&stage<2);}
function loadStage(i){if(busy||i>unlocked)return;stage=i;selected=[];played=false;cleared=false;lastResult=null;$('stageLabel').textContent=`STAGE ${i+1} / 3　${'★'.repeat(i+1)}${'☆'.repeat(2-i)}`;$('stageTitle').textContent=stages[i].title;$('mission').textContent=stages[i].mission;resetScene();feedback(`命令カードを${stages[i].required.length}枚選んで、ロボットを動かそう！`);render()}
async function walkTo(x){const r=$('robot');r.classList.add('walk');setRobotX(x);await time(1000);r.classList.remove('walk')}
async function actAt(x,emoji){await walkTo(x);$('robot').classList.add('work');if(emoji){$('held').textContent=emoji;$('held').hidden=false}await time(520);$('robot').classList.remove('work')}
function hide(id){$(id).style.opacity='0'}
function failFor(id,st){if(['openWindow','lightOff','sit'].includes(id))return 'その命令は今回の目標には必要ないよ。';if(id==='pick'&&st.paperTaken)return 'ゴミはもう拾っているよ。';if(id==='carry'&&!st.paperTaken)return 'まだゴミを持っていないよ。';if(id==='drop'&&!st.paperTaken)return 'ゴミを拾ってから、ゴミ箱に入れよう。';if(id==='drop'&&stage===0&&!st.carried)return 'ゴミ箱まで運んでから入れよう。';if(id==='takeBroom'&&st.broomHeld)return 'ほうきはもう持っているよ。';if(id==='sweep'&&!st.broomHeld)return 'ほうきを持っていないから掃けないよ。';if(id==='collect'&&!st.swept)return '先に床を掃いて、ゴミを集めよう。';if(id==='discard'&&!st.collected)return 'まだゴミを集めていないよ。';if(id==='returnBroom'&&!st.broomHeld)return 'まだほうきを持っていないよ。';if(id==='returnBroom'&&!st.swept)return '床を掃く前にほうきを片付けてしまうよ。';if(id==='takeRag'&&st.ragHeld)return '雑巾はもう持っているよ。';if(id==='wipe'&&!st.ragHeld)return '雑巾を持ってから机を拭こう。';if(id==='returnRag'&&!st.ragHeld)return 'まだ雑巾を持っていないよ。';if(id==='returnRag'&&!st.wiped)return '机を拭いてから雑巾を片付けよう。';return null}
async function perform(id,st){
 switch(id){
 case 'pick':await actAt(39,'🗞️');hide('paper');st.paperTaken=true;break;
 case 'carry':await walkTo(70);st.carried=true;break;
 case 'drop':await actAt(70);$('held').hidden=true;st.paperTaken=false;st.paperDone=true;break;
 case 'takeBroom':await actAt(9,'🧹');hide('broom');st.broomHeld=true;break;
 case 'sweep':await actAt(49,st.broomHeld?'🧹':null);hide('dust');st.swept=true;break;
 case 'collect':await actAt(50,'🍂');st.collected=true;break;
 case 'discard':await actAt(70);$('held').hidden=true;st.discarded=true;break;
 case 'returnBroom':await actAt(9);$('held').hidden=true;st.broomHeld=false;st.broomReturned=true;break;
 case 'takeRag':await actAt(28,'🧽');hide('rag');st.ragHeld=true;break;
 case 'wipe':await actAt(68,'🧽');hide('smudge');st.wiped=true;break;
 case 'returnRag':await actAt(28);$('held').hidden=true;st.ragHeld=false;st.ragReturned=true;break;
 }
 say(commands[id][0]+'、できたよ！');beep(490);await time(340);
}
function complete(st){if(stage===0)return st.paperDone;if(stage===1)return st.swept&&st.discarded&&st.broomReturned;if(stage===2)return st.paperDone&&st.wiped&&st.ragReturned&&st.swept&&st.broomReturned;return false}
async function run(){if(busy||selected.length!==stages[stage].required.length)return;busy=true;cleared=false;played=false;resetScene();render();feedback('ロボットが命令を実行しています…');const st={};let reason=null;for(let i=0;i<selected.length;i++){const id=selected[i];const slot=$('slot'+i);slot.classList.add('active');$('status').textContent=`実行中：${i+1}番目「${commands[id][0]}」`;say(commands[id][0]+'！');beep(400);await time(350);reason=failFor(id,st);if(reason){slot.classList.remove('active');break}await perform(id,st);slot.classList.remove('active')}
 if(reason){say('あれ？ できないよ…');$('status').textContent='途中でストップ';feedback('🤔 '+reason+' 命令を直して、もう一度挑戦しよう。','bad');beep(220)}else if(complete(st)){cleared=true;unlocked=Math.max(unlocked,Math.min(2,stage+1));$('robot').classList.add('happy');say('やった！ ミッションクリア！');$('status').textContent='🎉 ステージクリア！';feedback(stage===2?'🎉 全ステージクリア！ 命令を考え、試し、直すことができたね！':'🎉 大成功！ ロボットが命令どおりに動いたよ。次のステージにも挑戦しよう！','ok');beep(760);await time(180);beep(980)}else{say('あと少し！');$('status').textContent='ミッション未達成';feedback('必要な作業がまだ終わっていないよ。命令を見直そう。','bad')}
 busy=false;played=true;lastResult={reason,cleared};render();}
$('run').addEventListener('click',run);
$('replay').addEventListener('click',run);
$('undo').addEventListener('click',()=>{if(busy)return;selected.pop();played=false;cleared=false;resetScene();render()});
$('reset').addEventListener('click',()=>{if(busy)return;selected=[];played=false;cleared=false;resetScene();feedback('最初から命令を考えよう！');render()});
$('hint').addEventListener('click',()=>{if(!busy)feedback('💡 ヒント：'+stages[stage].hint)});
$('next').addEventListener('click',()=>{if(cleared&&stage<2)loadStage(stage+1)});
loadStage(0);
})();
</script></body></html>
